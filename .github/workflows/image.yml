name: Image

# Every push to main publishes `edge` and `sha-<commit>`; a vX.Y.Z tag pushed
# by hand publishes the release tags. Releases are normally cut by
# release.yml, which builds the image itself - a tag created by a workflow
# does not start other workflows.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore:
      - 'README.md'
      - 'demo/**'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  proxy:
    uses: ./.github/workflows/proxy.yml

  build:
    needs: [tests, proxy]
    uses: ./.github/workflows/build.yml
