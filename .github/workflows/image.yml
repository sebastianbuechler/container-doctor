name: Image

# Publishes ghcr.io/<owner>/container-doctor for amd64 and arm64.
#
#   a push to main  -> edge, sha-<commit>
#   a tag v1.2.3    -> 1.2.3, 1.2, latest, sha-<commit>
#
# `latest` moves only with a release, so a deployment tracking it gets
# releases, not every merge. Pin `1.2.3@sha256:...` to choose when to move.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/container-doctor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            DOCTOR_BUILD=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
