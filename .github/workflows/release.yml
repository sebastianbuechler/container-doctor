name: Release

# Cuts a release from main: tags vX.Y.Z, publishes the image for it, then
# publishes the GitHub release with generated notes. Run it from the Actions
# tab, or through the API, with the version.
#
# In that order so a release is never announced without its image: if the
# build fails, the tag exists and the run can be re-run; the release appears
# only once X.Y.Z can be pulled.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (no leading v)
        required: true

permissions:
  contents: read

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        name: Check the version
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          version="${VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not X.Y.Z"
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main, not $REF"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Tag the commit
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            if [ "$(git ls-remote --tags origin "refs/tags/$tag^{}" | cut -f1)" = "$GITHUB_SHA" ]; then
              echo "$tag already points at this commit; carrying on (a re-run)."
              exit 0
            fi
            echo "::error::$tag already exists on another commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Container Doctor $VERSION" "$GITHUB_SHA"
          git push origin "$tag"

  image:
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.tag.outputs.version }}

  release:
    needs: [tag, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/container-doctor
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          printf 'Image: `%s:%s@%s`\n' "$IMAGE" "$VERSION" "$DIGEST" > notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$VERSION" --generate-notes --notes-file notes.md
