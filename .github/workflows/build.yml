name: Build image

# The image build, in one place: image.yml calls it for pushes, release.yml
# for releases. Publishes ghcr.io/<owner>/container-doctor for amd64 and arm64.
#
#   main                -> edge, sha-<commit>
#   a release (version) -> X.Y.Z, X.Y, latest, sha-<commit>
#
# `latest` moves only with a release, so a deployment tracking it gets
# releases, not every merge. Pin `X.Y.Z@sha256:...` to choose when to move.
on:
  workflow_call:
    inputs:
      version:
        description: The release, X.Y.Z. Empty for a build of main - or of a pushed vX.Y.Z tag, read from the ref.
        type: string
        default: ""
    outputs:
      digest:
        description: The pushed image's digest
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # The commit the run started from: a release tags exactly that one, and
      # main may have moved on while the tag job ran.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release this build is for: the input, else a pushed vX.Y.Z tag.
      - id: version
        env:
          INPUT: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          version="$INPUT"
          if [ -z "$version" ] && [[ "$REF" == refs/tags/v* ]]; then
            version="${REF#refs/tags/v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/container-doctor
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-args: |
            DOCTOR_BUILD=${{ github.sha }}
            DOCTOR_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
