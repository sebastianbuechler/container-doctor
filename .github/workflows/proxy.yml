name: Socket proxy boundary
on:
  pull_request:
    paths:
      - 'compose.example.yaml'
      - 'Dockerfile'
      - 'tests/test_socket_proxy.py'
      - '.github/workflows/proxy.yml'
  workflow_dispatch:
  # Run before every image build, like tests.yml.
  workflow_call:
permissions:
  contents: read
jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read the image's Python version
        id: python
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+).*/\1/p' Dockerfile)
          test -n "$version" || { echo "::error::No python base image in Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Compose configuration
        run: docker compose -f compose.example.yaml config --quiet
      # Starts the real proxy image with compose.example.yaml's settings and
      # proves the doctor can restart a container and cannot create one.
      - name: Test proxy startup and endpoint permissions
        env:
          DOCTOR_PROXY_INTEGRATION: '1'
        run: python -m unittest discover -s tests -p test_socket_proxy.py -v
