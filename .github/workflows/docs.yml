name: Docs

# Builds the documentation site (docs/, Astro Starlight) on every pull request
# that touches it - the build fails on a broken internal link - and publishes it
# to GitHub Pages from main. The site carries the dashboard itself as a demo
# (docs/scripts/build-demo.mjs), so a change to app/web/static rebuilds it too.
#
# The generated environment variable reference is checked by the tests
# (tests/test_docs.py), so a setting changed without regenerating it fails
# there, wherever the change is.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'app/web/static/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'app/web/static/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # "Last updated" dates come from git history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          # Cloudflare Web Analytics, for the published site only: a repository
          # variable (not a secret - the token is public in every page).
          # Unset, the site carries no analytics.
          CF_BEACON_TOKEN: ${{ github.ref == 'refs/heads/main' && vars.CF_BEACON_TOKEN || '' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
