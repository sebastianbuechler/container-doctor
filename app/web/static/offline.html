<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Container Doctor - offline</title>
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<style>
  /* Self-contained: this page is shown exactly when nothing else can load. */
  :root {
    --plane: #f7f7f5; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --ink-muted: #898781; --hairline: #e1e0d9; --warning: #fab219; --accent: #2a78d6;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --plane: #111110; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --ink-muted: #898781; --hairline: #2c2c2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--plane);
  }
  .card {
    width: min(24rem, 100%); padding: 32px 28px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px;
  }
  h1 { font-size: 18px; margin: 6px 0 0; }
  p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .when { font-size: 12.5px; color: var(--ink-muted); }
  button {
    margin-top: 8px; font: inherit; font-size: 14px; font-weight: 600; color: #fff;
    background: var(--accent); border: 0; border-radius: 8px; padding: 9px 18px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  .icon { width: 40px; height: 40px; fill: none; stroke: var(--warning); stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<main class="card" role="alert">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
  <h1>Can't reach Container Doctor</h1>
  <p>Your device may be off the VPN or the home network. This page opens the
     dashboard by itself as soon as it can reach it.</p>
  <button type="button" id="retry">Try again</button>
  <span class="when" id="when"></span>
</main>
<script>
  // Looks every few seconds, and straight away when the app comes back to
  // the front or the device says it is online - usually the moment the VPN
  // connects.
  const button = document.getElementById("retry");
  const when = document.getElementById("when");
  let timer = null;
  let next = 0;

  async function check() {
    clearTimeout(timer);
    button.disabled = true;
    when.textContent = "Checking…";
    try {
      const response = await fetch("/healthz", { cache: "no-store" });
      if (response.ok) { location.reload(); return; }
    } catch (_) { /* still out of reach */ }
    button.disabled = false;
    next = Date.now() + 5000;
    timer = setTimeout(check, 5000);
  }

  setInterval(() => {
    if (!button.disabled && next) {
      when.textContent = `Trying again in ${Math.max(0, Math.ceil((next - Date.now()) / 1000))}s`;
    }
  }, 500);
  button.addEventListener("click", check);
  window.addEventListener("online", check);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  check();
</script>
</body>
</html>
